<!DOCTYPE html>
<html>
<head>
<style>
/* 1. Universal Selector */
* {
  font-family: Arial;
}

/* 2. Element Selector */
p {
  color: green;
}

/* 3. ID Selector */
#special {
  color: red;
  font-weight: bold;
}

/* 4. Class Selector */
.center {
  text-align: center;
  color: blue;
}

/* 5. Group Selector */
h1, h2 {
  text-decoration: underline;
}
</style>
</head>

<body>
<h1>Group Selector (h1)</h1>
<h2>Group Selector (h2)</h2>

<p>Element Selector applied</p>

<p id="special">ID Selector applied</p>

<p class="center">Class Selector applied</p>

</body>
</html>
