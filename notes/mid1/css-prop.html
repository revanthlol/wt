<!DOCTYPE html>
<html>
<head>
    <title>Font and Text Properties</title>
    <style type="text/css">
        body {
            font-family: Arial;
            font-size: 16px;
        }
        /* FONT PROPERTIES */
        .fontProps {
            color: crimson;              /* Font color */
            font-family: serif;          /* Font family */
            font-size: 24px;             /* Font size */
            font-style: italic;          /* Font style */
            font-variant: small-caps;    /* Font variant */
            font-weight: bold;           /* Font weight */
        }
        /* TEXT PROPERTIES */
        .textProps {
            color: royalblue;            /* Text color */
            text-align: center;          /* Text alignment */
            text-decoration: underline; /* Text decoration */
            font-size: 20px;
        }
    </style>
</head>
<body>
    <p class="fontProps">This text shows all FONT properties</p>
    <p class="textProps">This text shows all TEXT properties</p>
</body>
</html>
