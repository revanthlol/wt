<!DOCTYPE html>
<html>
<head>
    <title>Table Task</title>
</head>
<body style="align-items: center;">

    <h1 >Student Report</h1>

    <table border="1" width="300"  cellpadding="10" cellspacing="0">
        
        <colgroup>
            <col width="40%" bgcolor="#f9f9f9"> <col span="2" width="30%"></colgroup>

        <thead>
            <tr bgcolor="#dddddd">
                <th>Subject</th>
                <th>Marks</th>
                <th>Grade</th>
            </tr>
        </thead>

        <tbody>
            <tr>
                <td>JAVA</td>
                <td>85</td>
                <td>A</td>
            </tr>
            <tr>
                <td>DBMS</td>
                <td>78</td>
                <td>B</td>
            </tr>
            <tr>
                <td rowspan="2" valign="middle">Web Tech</td>
                <td>Theory: 80</td>
                <td>A</td>
            </tr>
            <tr>
                <td>Lab: 92</td>
                <td>A+</td>
            </tr>
        </tbody>

        <tfoot>
            <tr bgcolor="#eeeeee">
                <td colspan="2"><b>Final CGPA</b></td>
                <td><b>9.2</b></td>
            </tr>
        </tfoot>

    </table>

</body>
</html>
