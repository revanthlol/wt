<!DOCTYPE html>
<html>
<head>
    <title>Types of CSS</title>

    <!-- INTERNAL / EMBEDDED CSS -->
    <style type="text/css">
        .internal {
            color: green;
            font-size: 30px;
            text-align: center;
        }

        .external {
            color: blue;
            font-size: 25px;
            text-align: center;
        }
    </style>

    <!-- EXTERNAL CSS (Normally linked like this) <link rel="stylesheet" href="style.css" type="text/css"> -->
</head>

<body>

    <!-- INLINE CSS -->
    <p style="color:red; font-size:35px; text-align:center;">
        This is Inline CSS
    </p>

    <!-- INTERNAL CSS -->
    <p class="internal">
        This is Internal CSS
    </p>

    <!-- EXTERNAL CSS (simulated class usage)  -->
    <p class="external">
        This is External CSS
    </p>

</body>
</html>
