<!doctype html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assignment 3</title>
    <style>
      body {
        text-align: center;
        font-family: Arial, sans-serif;
        margin-top: 50px;
        background-color: #f4f4f9;
      }
      button {
        padding: 15px 30px;
        font-size: 16px;
        margin: 10px;
        cursor: pointer;
        background-color: #00b342;
        color: white;
        border: none;
        border-radius: 25px;
      }
    </style>
  </head>

  <body style="font-family: Arial; margin: 0">
    
    <div id="navbar"></div>
    <h2 style="text-align: center">Assignment 3</h2>

    <button onclick="start()">Start Program</button>

    <script>
      // Navbar logic
      // Try to fetch navbar from current folder, then parent, then grand-parent
      const paths = ["navbar.html", "../navbar.html", "../../navbar.html"];

      function loadNav(index) {
        if (index >= paths.length) return;

        fetch(paths[index])
          .then(response => {
            if (response.ok) return response.text();
            throw new Error("Not found");
          })
          .then(data => {
            document.getElementById("navbar").innerHTML = data;

            const parser = new DOMParser();
            const doc = parser.parseFromString(data, "text/html");
            const scripts = doc.querySelectorAll("script");
            scripts.forEach(oldScript => {
              const newScript = document.createElement("script");
              newScript.textContent = oldScript.textContent;
              document.body.appendChild(newScript);
            });
          })
          .catch(() => loadNav(index + 1));
      }

      loadNav(0);

      function start() {
        while (true) {
          var c = prompt(
            "Select an option:\n" +
              "1. Greatest of 3 numbers\n" +
              "2. Check Grade\n" +
              "3. Fibonacci Series\n" +
              "4. Day of Week\n" +
              "5. Armstrong Number\n" +
              "6. Factorial\n" +
              "0. Exit"
          );

          if (c === null || c === "0") break;

          if (c === "1") greatest();
          else if (c === "2") grade();
          else if (c === "3") fib();
          else if (c === "4") day();
          else if (c === "5") armstrong();
          else if (c === "6") factorial();
          else alert("Invalid selection. Please try again.");
        }
      }

      // 1. Greatest of 3 numbers
      function greatest() {
        var a = Number(prompt("Enter First Number:"));
        var b = Number(prompt("Enter Second Number:"));
        var c = Number(prompt("Enter Third Number:"));

        if (isNaN(a) || isNaN(b) || isNaN(c))
          alert("Please enter valid numbers.");
        else
          alert("The greatest number is: " + Math.max(a, b, c));
      }

      // 2. Check Grade
      function grade() {
        var m = Number(prompt("Enter Marks (0-100):"));

        if (isNaN(m)) alert("Invalid input");
        else if (m >= 90) alert("Grade: A");
        else if (m >= 75) alert("Grade: B");
        else if (m >= 60) alert("Grade: C");
        else alert("Result: Fail");
      }

      // 3. Fibonacci Series
      function fib() {
        var n = Number(prompt("Enter number of terms:"));
        if (isNaN(n) || n < 1) {
          alert("Please enter a positive number.");
          return;
        }

        var a = 0, b = 1;
        var out = "0";

        if (n > 1) out += ", 1";

        for (var i = 3; i <= n; i++) {
          var c = a + b;
          out += ", " + c;
          a = b;
          b = c;
        }

        alert("Fibonacci Series: " + out);
      }

      // 4. Day of Week (switch case)
      function day() {
        var d = Number(prompt("Enter Day number (1-7):"));
        var result;

        switch (d) {
          case 1: result = "Monday"; break;
          case 2: result = "Tuesday"; break;
          case 3: result = "Wednesday"; break;
          case 4: result = "Thursday"; break;
          case 5: result = "Friday"; break;
          case 6: result = "Saturday"; break;
          case 7: result = "Sunday"; break;
          default: result = "Invalid day number";
        }

        alert(result);
      }

      // 5. Armstrong Number
      function armstrong() {
        var n = Number(prompt("Enter a number:"));
        if (isNaN(n) || n < 0) {
          alert("Invalid input");
          return;
        }

        var temp = n, sum = 0;
        var digits = n.toString().length;

        while (temp > 0) {
          var r = temp % 10;
          sum += Math.pow(r, digits);
          temp = Math.floor(temp / 10);
        }

        if (sum === n)
          alert(n + " is an Armstrong number");
        else
          alert(n + " is NOT an Armstrong number");
      }

      // 6. Factorial
      function factorial() {
        var n = Number(prompt("Enter a number:"));
        if (isNaN(n) || n < 0) {
          alert("Invalid input");
          return;
        }

        var fact = 1;
        for (var i = 1; i <= n; i++) {
          fact *= i;
        }

        alert("Factorial of " + n + " is: " + fact);
      }
    </script>
  </body>
</html>
