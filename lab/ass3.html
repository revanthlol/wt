<!doctype html>
<html>
  <head>
    <title>Assignment 3</title>
    <style>
      body {
        text-align: center;
        font-family: Arial, sans-serif;
        margin-top: 50px;
        background-color: #f4f4f9;
      }
      button {
        padding: 15px 30px;
        font-size: 16px;
        margin: 10px;
        cursor: pointer;
        background-color: #00b342;
        color: white;
        border: none;
        border-radius: 5px;
      }
      button:hover {
        background-color: #00b342;
      }
    </style>
  </head>

  <body style="font-family: Arial; margin: 0">
    <div id="navbar"></div>
    <h2 style="text-align: center">Assignment 3</h2>
  </body>
    <button onclick="start()">Start Program</button>
    <script>
      // Try to fetch navbar from current folder, then parent, then grand-parent
      const paths = ["navbar.html", "../navbar.html", "../../navbar.html"];
      
      function loadNav(index) {
        if (index >= paths.length) return; // Stop if not found
        
        fetch(paths[index])
          .then(response => {
            if (response.ok) return response.text();
            throw new Error("Not found");
          })
          .then(data => {
            document.getElementById("navbar").innerHTML = data;
            
            // Re-execute scripts inside navbar (like the Magic Path Fixer)
            const parser = new DOMParser();
            const doc = parser.parseFromString(data, 'text/html');
            const scripts = doc.querySelectorAll('script');
            scripts.forEach(oldScript => {
              const newScript = document.createElement('script');
              newScript.textContent = oldScript.textContent;
              document.body.appendChild(newScript);
            });
          })
          .catch(() => loadNav(index + 1)); // Try next path if failed
      }

      loadNav(0);

      function start() {
        while (true) {
          var c = prompt(
            "Select an option:\n" +
              "1. Greatest of 3 numbers\n" +
              "2. Check Grade\n" +
              "3. Fibonacci Series\n" +
              "4. Day of Week\n" +
              "0. Exit",
          );

          // Break loop if user clicks Cancel or enters 0
          if (c === null || c === "0") break;

          if (c === "1") greatest();
          else if (c === "2") grade();
          else if (c === "3") fib();
          else if (c === "4") day();
          else alert("Invalid selection. Please try again.");
        }
      }

      function greatest() {
        var a = Number(prompt("Enter First Number:"));
        var b = Number(prompt("Enter Second Number:"));
        var c = Number(prompt("Enter Third Number:"));

        if (isNaN(a) || isNaN(b) || isNaN(c)) {
          alert("Please enter valid numbers.");
        } else {
          alert("The greatest number is: " + Math.max(a, b, c));
        }
      }

      function grade() {
        var m = Number(prompt("Enter Marks (0-100):"));

        if (isNaN(m)) alert("Invalid input");
        else if (m >= 90) alert("Grade: A");
        else if (m >= 75) alert("Grade: B");
        else if (m >= 60) alert("Grade: C");
        else alert("Result: Fail");
      }

      function fib() {
        var n = Number(prompt("Enter number of terms:"));
        if (isNaN(n) || n < 1) {
          alert("Please enter a positive number.");
          return;
        }

        var a = 0,
          b = 1;
        var out = "0";

        if (n > 1) out = out + ", 1";

        for (var i = 3; i <= n; i++) {
          var c = a + b;
          out = out + ", " + c;
          a = b;
          b = c;
        }
        alert("Fibonacci Series: " + out);
      }

      function day() {
        var d = Number(prompt("Enter Day number (1-7):"));
        var days = [
          "Invalid",
          "Monday",
          "Tuesday",
          "Wednesday",
          "Thursday",
          "Friday",
          "Saturday",
          "Sunday",
        ];

        if (d >= 1 && d <= 7) {
          alert(days[d]);
        } else {
          alert("Invalid day number");
        }
      }
    </script>
  </body>
</html>
