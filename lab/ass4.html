<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Assignment 4 - Calculators</title>
  
  <!-- Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }
    
    body {
      background: #111;
      color: #fff;
      text-align: center;
    }
    
    h2 {
      margin: 20px 0;
    }
    
    #navbar {
      width: 100%;
    }
    
    .wrap {
      display: flex;
      justify-content: center;
      gap: 20px;
      padding: 20px;
      flex-wrap: wrap;
    }
    
    .card {
      background: #1e1e1e;
      padding: 16px;
      border-radius: 8px;
      width: 280px;
    }
    
    .card h3 {
      margin-bottom: 12px;
      font-size: 18px;
    }
    
    input {
      width: 100%;
      height: 40px;
      margin-bottom: 10px;
      padding: 6px 10px;
      background: #000;
      color: #fff;
      border: 1px solid #333;
      border-radius: 8px;
      font-size: 16px;
      text-align: right;
    }
    
    .grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }
    
    button {
      height: 40px;
      border: 1px solid #333;
      border-radius: 8px;
      background: #222;
      color: #fff;
      font-size: 16px;
      cursor: pointer;
    }
    
    button:hover {
      background: #333;
    }
    
    .op {
      background: #444;
    }
    
    .clr {
      background: #883333;
    }
    
    .eq {
      background: #336633;
    }
    </style>
    
</head>

<body>

<div id="navbar"></div>
<h2>Assignment 4</h2>

<div class="wrap">

  <!-- SIMPLE CALCULATOR -->
  <div class="card">
    <h3>Simple Calculator</h3>
  
    <div class="row">
      <label>Enter value of A</label>
      <input id="a" type="number">
    </div>
  
    <div class="row">
      <label>Enter value of B</label>
      <input id="b" type="number">
    </div>
  
    <div class="grid">
      <button class="op" onclick="s('+')">+</button>
      <button class="op" onclick="s('-')">−</button>
      <button class="op" onclick="s('*')">×</button>
      <button class="op" onclick="s('/')">÷</button>
    </div>
  
    <div class="row">
      <label>Result</label>
      <input id="r" readonly>
    </div>
  </div>
  

<!-- ADVANCED CALCULATOR -->
<div class="card">
  <h3>Standard Calculator</h3>
  <input type="text" id="display" readonly style="font-size: 32px; letter-spacing: 2px;">

  <div class="grid">
    <button class="clr" onclick="clearDisplay()">C</button>
    <button class="op" onclick="append('%')">%</button>
    <button class="op" onclick="append('/')">÷</button>
    <button class="op" onclick="append('*')">×</button>

    <button onclick="append('7')">7</button>
    <button onclick="append('8')">8</button>
    <button onclick="append('9')">9</button>
    <button class="op" onclick="append('-')">−</button>

    <button onclick="append('4')">4</button>
    <button onclick="append('5')">5</button>
    <button onclick="append('6')">6</button>
    <button class="op" onclick="append('+')">+</button>

    <button onclick="append('1')">1</button>
    <button onclick="append('2')">2</button>
    <button onclick="append('3')">3</button>
    <!-- Note: In normal calcs 0 is mostly span 2, but we stick to the grid of 4 -->
    <button onclick="append('0')">0</button> 

    <button onclick="append('.')">.</button>
    <!-- Equal spans to fill -->
    <button class="eq span-4" style="grid-column: span 3;" onclick="calculate()">=</button>
  </div>
</div>

</div>

<script>
  // --- NAVBAR LOADING LOGIC ---
  const paths = ["navbar.html", "../navbar.html", "../../navbar.html"];
      
  function loadNav(index) {
    if (index >= paths.length) return;
    
    fetch(paths[index])
      .then(response => {
        if (response.ok) return response.text();
        throw new Error("Not found");
      })
      .then(data => {
        document.getElementById("navbar").innerHTML = data;
        
        // Execute scripts in navbar (e.g. active link highlighter)
        const parser = new DOMParser();
        const doc = parser.parseFromString(data, 'text/html');
        const scripts = doc.querySelectorAll('script');
        scripts.forEach(oldScript => {
          const newScript = document.createElement('script');
          newScript.textContent = oldScript.textContent;
          document.body.appendChild(newScript);
        });
      })
      .catch(() => loadNav(index + 1));
  }
  loadNav(0);

  // --- SIMPLE CALCULATOR LOGIC ---
  const s = (op) => {
    const valA = parseFloat(a.value);
    const valB = parseFloat(b.value);
    if (isNaN(valA) || isNaN(valB)) {
      r.value = "Error";
      return;
    }
    r.value = eval(valA + op + valB); 
  };

  // --- ADVANCED CALCULATOR LOGIC ---
  function append(value) {
    document.getElementById("display").value += value;
  }

  function clearDisplay() {
    document.getElementById("display").value = "";
  }

  function calculate() {
    try {
      document.getElementById("display").value = eval(document.getElementById("display").value);
    } catch (e) {
      document.getElementById("display").value = "Error";
    }
  }
</script>

</body>
</html>
